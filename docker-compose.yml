services:
  postgres:
    image: postgres:16-alpine
    container_name: nivra-postgres
    environment:
      POSTGRES_DB: nivra
      POSTGRES_USER: nivra
      POSTGRES_PASSWORD: nivra
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/000001_init.sql:ro
      - ./backend/migrations/000002_phone_otp.up.sql:/docker-entrypoint-initdb.d/000002_phone_otp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nivra -d nivra"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nivra-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: nivra-backend
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgres://nivra:nivra@postgres:5432/nivra?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: nivra-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:

