openapi: 3.1.0
info:
  title: Nivra API
  version: 0.1.0
  description: Production-oriented REST API for Nivra V1.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
paths:
  /auth/signup:
    post:
      security: []
      summary: Create a user account
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/login:
    post:
      security: []
      summary: Authenticate with email and password
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/refresh:
    post:
      security: []
      summary: Rotate refresh token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token pair rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/logout:
    post:
      security: []
      summary: Revoke refresh token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Logged out
  /auth/forgot-password:
    post:
      security: []
      summary: Issue password reset token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Reset request accepted
  /auth/reset-password:
    post:
      security: []
      summary: Reset password with one-time token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 12
      responses:
        "200":
          description: Password reset
  /auth/verify-email:
    post:
      security: []
      summary: Verify email with one-time token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Email verified
  /users/me:
    get:
      summary: Return current user profile
      tags: [Users]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /groups:
    get:
      summary: List current user's groups
      tags: [Groups]
      responses:
        "200":
          description: Groups listed
    post:
      summary: Create a group
      tags: [Groups]
      responses:
        "201":
          description: Group created
  /groups/{group_id}/expenses:
    get:
      summary: List expenses in a group
      tags: [Expenses]
      parameters:
        - $ref: "#/components/parameters/GroupID"
      responses:
        "200":
          description: Expenses listed
    post:
      summary: Add an expense to a group
      tags: [Expenses]
      parameters:
        - $ref: "#/components/parameters/GroupID"
      responses:
        "201":
          description: Expense created
  /groups/{group_id}/balances:
    get:
      summary: Get group member balances
      tags: [Settlements]
      parameters:
        - $ref: "#/components/parameters/GroupID"
      responses:
        "200":
          description: Balances returned
  /groups/{group_id}/settlement-plan:
    get:
      summary: Get optimized settlement plan
      tags: [Settlements]
      parameters:
        - $ref: "#/components/parameters/GroupID"
      responses:
        "200":
          description: Settlement plan returned
  /dashboard/summary:
    get:
      summary: Get dashboard summary metrics
      tags: [Dashboard]
      responses:
        "200":
          description: Summary returned
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GroupID:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Invalid or missing token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SignUpRequest:
      type: object
      required: [full_name, email, password]
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        phone_number:
          type: string
        password:
          type: string
          minLength: 12
        preferred_currency:
          type: string
          minLength: 3
          maxLength: 3
          default: INR
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
            tokens:
              $ref: "#/components/schemas/TokenPair"
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        access_token_expires_at:
          type: string
          format: date-time
        refresh_token_expires_at:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
          nullable: true
        profile_picture_url:
          type: string
          nullable: true
        preferred_currency:
          type: string
        theme_preference:
          type: string
        role:
          type: string
        status:
          type: string
        email_verified:
          type: boolean
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

